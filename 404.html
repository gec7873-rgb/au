<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>404 – Page Not Found | AU Bank</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --purple:#42235F;
  --purple-dark:#3B2057;
  --orange:#D94A18;
  --orange-dark:#B93D12;
  --orange-light:#F06A30;
  --white:#FFFFFF;
  --surface-soft:#F6F4FA;
  --text:#1A1A2E;
  --muted:#8A8A9E;
  --border:rgba(66,35,95,0.08);
}
html,body{
  height:100%;
  font-family:'DM Sans',sans-serif;
  background:linear-gradient(135deg,var(--surface-soft) 0%,#F0EBF5 100%);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
}
body{
  display:flex;
  flex-direction:column;
  min-height:100vh;
}

/* ── NAVBAR ── */
.navbar{
  position:sticky;top:0;z-index:500;
  width:100%;height:58px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 18px;
  background:linear-gradient(135deg,var(--purple) 0%,var(--purple-dark) 100%);
  box-shadow:0 2px 20px rgba(66,35,95,0.28);
  overflow:hidden;
}
.navbar::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.08) 50%,transparent 70%);
  animation:shim 3.5s ease-in-out infinite;
}
@keyframes shim{0%{transform:translateX(-150%)}100%{transform:translateX(200%)}}
.nav-logo{
  display:flex;align-items:center;gap:10px;
  position:relative;z-index:1;text-decoration:none;
}
.nav-logo img{height:28px;width:auto;object-fit:contain}
.nav-back{
  display:flex;align-items:center;gap:6px;
  background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.2);
  border-radius:50px;padding:6px 14px;
  color:#fff;font-family:'Sora',sans-serif;font-size:12px;font-weight:600;
  cursor:pointer;text-decoration:none;
  transition:background .2s;position:relative;z-index:1;
}
.nav-back:hover{background:rgba(255,255,255,.2)}
.nav-back svg{width:14px;height:14px;stroke:#fff;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}

/* ── MAIN ── */
.main{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:40px 20px;
}
.card{
  width:100%;
  max-width:480px;
  background:var(--white);
  border-radius:20px;
  box-shadow:0 8px 28px rgba(66,35,95,0.12);
  border:1px solid var(--border);
  padding:48px 32px;
  text-align:center;
  animation:fadeUp .5s cubic-bezier(.4,0,.2,1) both;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

.error-icon{
  width:96px;height:96px;
  background:linear-gradient(135deg,rgba(217,74,24,.1),rgba(217,74,24,.05));
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 24px;
  border:2px solid rgba(217,74,24,.15);
}
.error-icon svg{width:48px;height:48px;stroke:var(--orange);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

h1{
  font-family:'Sora',sans-serif;
  font-size:64px;font-weight:800;
  line-height:1;letter-spacing:-3px;
  background:linear-gradient(135deg,var(--purple) 0%,var(--orange) 100%);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
  margin-bottom:12px;
}
h2{
  font-family:'Sora',sans-serif;
  font-size:20px;font-weight:800;
  color:var(--text);
  margin-bottom:12px;
}
p{
  color:var(--muted);
  font-size:14px;
  line-height:1.6;
  margin-bottom:32px;
}

.actions{
  display:flex;
  gap:12px;
  justify-content:center;
  flex-wrap:wrap;
}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:14px 28px;
  font-family:'Sora',sans-serif;font-size:14px;font-weight:700;
  border:none;border-radius:20px;
  cursor:pointer;text-decoration:none;
  transition:all .22s;
  letter-spacing:.2px;
}
.btn-primary{
  background:linear-gradient(135deg,var(--orange),var(--orange-dark));
  color:#fff;
  box-shadow:0 8px 32px rgba(217,74,24,0.3);
}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 12px 36px rgba(217,74,24,0.4)}
.btn-secondary{
  background:transparent;
  color:var(--purple);
  border:2px solid var(--purple);
}
.btn-secondary:hover{background:rgba(66,35,95,.05);transform:translateY(-2px)}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}

.divider{
  margin-top:32px;
  padding-top:20px;
  border-top:1px solid var(--border);
  font-size:11.5px;
  color:var(--muted);
  letter-spacing:.3px;
  font-family:'Sora',sans-serif;
  font-weight:500;
}

@media(max-width:520px){
  .card{padding:36px 22px}
  h1{font-size:52px}
  h2{font-size:18px}
  .actions{flex-direction:column}
  .btn{width:100%}
}
</style>
</head>
<body>

<nav class="navbar">
  <a class="nav-logo" href="/au/">
    <img src="https://www.au.bank.in/content/dam/aubank/in/en/header/AU-Logo_H30px-1.svg" alt="AU Bank">
  </a>
  <a class="nav-back" href="/au/">
    <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    Back
  </a>
</nav>

<div class="main">
  <div class="card">
    <div class="error-icon">
      <svg viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="8" x2="12" y2="12"/>
        <line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
    </div>
    <h1>404</h1>
    <h2>Page Not Found</h2>
    <p>The page you are looking for doesn't exist or has been moved. Please check the URL or head back to the homepage.</p>
    <div class="actions">
      <a class="btn btn-primary" href="/au/">
        <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Back to Home
      </a>
      <a class="btn btn-secondary" href="/au/login">
        <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        Login
      </a>
    </div>
    <div class="divider">AU Bank · Error 404 · Resource Not Found</div>
  </div>
</div>

</body>
</html>
